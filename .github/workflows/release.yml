name: Release

# Builds the card and publishes a GitHub release with roommind-card.js attached.
# Trigger it by pushing a tag like "v1.2.0" or by running it manually (Actions → Release → Run workflow).
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release tag, e.g. v1.2.0"
        required: true
      overwrite:
        description: "Move an existing tag to this commit and update its release"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Check that the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag $TAG does not match package.json version $expected"
            exit 1
          fi
      - name: Create or move the tag (manual runs)
        if: github.event_name == 'workflow_dispatch'
        env:
          OVERWRITE: ${{ inputs.overwrite }}
        run: |
          git fetch --tags --force origin
          existing="$(git rev-parse -q --verify "refs/tags/$TAG^{commit}" || true)"
          if [ "$existing" = "$GITHUB_SHA" ]; then
            echo "Tag $TAG already points to $GITHUB_SHA"
            exit 0
          fi
          if [ -n "$existing" ] && [ "$OVERWRITE" != "true" ]; then
            echo "::error::Tag $TAG already exists on $existing. Run again with 'overwrite' to move it to $GITHUB_SHA."
            exit 1
          fi
          git tag -f "$TAG" "$GITHUB_SHA"
          git push -f origin "refs/tags/$TAG"
      - name: Find release notes
        id: notes
        run: |
          file=".github/release-notes/$TAG.md"
          if [ -f "$file" ]; then echo "path=$file" >> "$GITHUB_OUTPUT"; fi
      - name: Publish release with roommind-card.js
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.TAG }}
          target_commitish: ${{ github.sha }}
          name: RoomMind Card ${{ env.TAG }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: true
          files: dist/roommind-card.js
